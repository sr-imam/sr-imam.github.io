<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found - Imam Hossain</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0f14;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .error-box {
            max-width: 600px;
        }

        .error-code {
            font-size: 100px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            color: #aeb7c4;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .home-btn {
            display: inline-block;
            padding: 13px 24px;
            background: #ffffff;
            color: #0b0f14;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .home-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="error-box">
        <div class="error-code">404</div>

        <h1>Page Not Found</h1>

        <p>
            Sorry, the page you're looking for doesn't exist
            or may have been moved.
        </p>

        <a href="/" class="home-btn">Back to Home</a>
    </div>

</body>
  </html>
